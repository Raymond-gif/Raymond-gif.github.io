<script>
  localStorage.setItem("theme", "light");
  document.documentElement.removeAttribute("data-theme");
</script>
<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.documentElement.removeAttribute("data-theme");

    var shell = document.querySelector(".rd-article-shell");
    if (!shell) return;

    var content = shell.querySelector(".page__content");
    var toc = shell.querySelector(".rd-article-toc nav");
    if (!content || !toc) return;

    var headings = Array.prototype.slice.call(content.querySelectorAll("h2, h3"))
      .filter(function (heading) {
        return heading.textContent.trim().length > 0;
      });

    if (headings.length < 2) {
      shell.classList.add("rd-article-shell--no-toc");
      return;
    }

    var list = document.createElement("ol");
    headings.forEach(function (heading, index) {
      if (!heading.id) {
        heading.id = "section-" + (index + 1) + "-" + heading.textContent
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
      }

      var item = document.createElement("li");
      item.className = heading.tagName.toLowerCase() === "h3" ? "rd-article-toc__subitem" : "";

      var link = document.createElement("a");
      link.href = "#" + heading.id;
      link.textContent = heading.textContent.trim();
      item.appendChild(link);
      list.appendChild(item);
    });

    toc.appendChild(list);
  });
</script>
