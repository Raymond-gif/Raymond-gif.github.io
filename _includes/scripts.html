<script>
  localStorage.setItem("theme", "light");
  document.documentElement.removeAttribute("data-theme");
</script>
<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.documentElement.removeAttribute("data-theme");

    var projectFilter = document.querySelector("[data-project-filter]");
    if (projectFilter) {
      var projectCards = Array.prototype.slice.call(document.querySelectorAll(".rd-project-grid .rd-project-card"));
      var emptyFilterMessage = document.querySelector("[data-project-filter-empty]");

      projectFilter.addEventListener("input", function () {
        var query = projectFilter.value.trim().toLowerCase();
        var visibleCount = 0;

        projectCards.forEach(function (card) {
          var matches = !query || card.textContent.toLowerCase().indexOf(query) !== -1;
          card.hidden = !matches;
          if (matches) visibleCount += 1;
        });

        if (emptyFilterMessage) emptyFilterMessage.hidden = visibleCount !== 0;
      });
    }

    var shell = document.querySelector(".rd-article-shell");
    if (!shell) return;

    var content = shell.querySelector(".page__content");
    var toc = shell.querySelector(".rd-article-toc nav");
    if (!content || !toc) return;

    content.querySelectorAll(".sidebar-toc").forEach(function (legacyToc) {
      legacyToc.remove();
    });

    content.querySelectorAll("a.button-gradient").forEach(function (link) {
      if (!/^Back to (Academic Works|Portfolio) Page$/i.test(link.textContent.trim().replace(/^[^A-Za-z]*/, ""))) return;

      var wrapper = link.parentElement;
      if (wrapper && wrapper.tagName === "P") {
        wrapper.remove();
      } else {
        link.remove();
      }
    });

    var headings = Array.prototype.slice.call(content.querySelectorAll("h2, h3"))
      .filter(function (heading) {
        return heading.textContent.trim().length > 0;
      });

    if (headings.length < 2) {
      shell.classList.add("rd-article-shell--no-toc");
      return;
    }

    var list = document.createElement("ol");
    var tocLinks = [];
    var tocItems = [];
    var headingParentIndexes = [];
    var currentParentIndex = -1;
    headings.forEach(function (heading, index) {
      if (!heading.id) {
        heading.id = "section-" + (index + 1) + "-" + heading.textContent
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
      }

      var isSubsection = heading.tagName.toLowerCase() === "h3";
      if (!isSubsection) currentParentIndex = index;
      headingParentIndexes[index] = currentParentIndex;

      var item = document.createElement("li");
      item.className = isSubsection ? "rd-article-toc__subitem" : "";
      item.dataset.parentIndex = String(currentParentIndex);

      var link = document.createElement("a");
      link.href = "#" + heading.id;
      link.textContent = heading.textContent.trim();
      tocLinks.push(link);
      tocItems.push(item);
      item.appendChild(link);
      list.appendChild(item);
    });

    toc.appendChild(list);

    var tocPanel = shell.querySelector(".rd-article-toc");
    var tocToggle = shell.querySelector(".rd-article-toc__toggle");
    var compactToc = window.matchMedia("(max-width: 980px)");

    function setTocOpen(isOpen) {
      if (!tocPanel || !tocToggle) return;
      tocPanel.classList.toggle("is-open", isOpen);
      tocToggle.setAttribute("aria-expanded", String(isOpen));
    }

    function syncTocLayout() {
      if (!tocToggle) return;
      tocToggle.disabled = !compactToc.matches;
      setTocOpen(!compactToc.matches);
    }

    if (tocToggle) {
      tocToggle.addEventListener("click", function () {
        if (!compactToc.matches) return;
        setTocOpen(!tocPanel.classList.contains("is-open"));
      });
    }

    if (compactToc.addEventListener) {
      compactToc.addEventListener("change", syncTocLayout);
    } else {
      compactToc.addListener(syncTocLayout);
    }
    syncTocLayout();

    var activeIndex = -1;
    var scrollFrame;

    function setActiveSection(index) {
      if (index === activeIndex) return;

      var activeParentIndex = headingParentIndexes[index];
      tocLinks.forEach(function (link, linkIndex) {
        var isActive = linkIndex === index;
        var isParentActive = linkIndex === activeParentIndex && linkIndex !== index;
        link.classList.toggle("is-active", isActive);
        link.classList.toggle("is-parent-active", isParentActive);

        if (tocItems[linkIndex].classList.contains("rd-article-toc__subitem")) {
          tocItems[linkIndex].classList.toggle(
            "is-contextual",
            Number(tocItems[linkIndex].dataset.parentIndex) === activeParentIndex
          );
        }

        if (isActive) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      activeIndex = index;

      var activeLink = tocLinks[index];
      if (!activeLink || !tocPanel || tocPanel.scrollHeight <= tocPanel.clientHeight) return;

      var linkTop = activeLink.offsetTop;
      var linkBottom = linkTop + activeLink.offsetHeight;
      if (linkTop < tocPanel.scrollTop) {
        tocPanel.scrollTop = linkTop;
      } else if (linkBottom > tocPanel.scrollTop + tocPanel.clientHeight) {
        tocPanel.scrollTop = linkBottom - tocPanel.clientHeight;
      }
    }

    function updateActiveSection() {
      var headingOffset = Math.min(160, Math.max(96, window.innerHeight * 0.18));
      var nextActiveIndex = 0;

      headings.forEach(function (heading, index) {
        if (heading.getBoundingClientRect().top <= headingOffset) {
          nextActiveIndex = index;
        }
      });

      if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) {
        nextActiveIndex = headings.length - 1;
      }

      setActiveSection(nextActiveIndex);
      scrollFrame = null;
    }

    function scheduleActiveSectionUpdate() {
      if (scrollFrame) return;
      scrollFrame = window.requestAnimationFrame(updateActiveSection);
    }

    tocLinks.forEach(function (link, index) {
      link.addEventListener("click", function () {
        setActiveSection(index);
        if (compactToc.matches) setTocOpen(false);
      });
    });

    window.addEventListener("scroll", scheduleActiveSectionUpdate, { passive: true });
    window.addEventListener("resize", scheduleActiveSectionUpdate);
    updateActiveSection();
  });
</script>
